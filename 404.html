<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halaman tidak ditemukan | Game Verse</title>
<link rel="icon" type="image/png" href="/GameVerse/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f3d3a; --muted:#5b7a4f; --aqua:#bfe8c2; --btn:#107c40; --mint:#50dcc5; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6fbf5; --muted:#9cc7b4; } body { background: linear-gradient(160deg,#071a18,#0c2a27 40%,#0f4a42) !important; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    background: linear-gradient(160deg, #ffffff 0%, #d9faf4 35%, var(--mint) 100%);
    color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  }
  .box { max-width: 460px; }
  .code { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: clamp(5rem, 24vw, 8rem); line-height: 1; color: var(--mint); text-shadow: 0 6px 24px rgba(43,179,160,.35); margin: 0; }
  h1 { font-family: "Baloo 2", sans-serif; font-size: 1.6rem; margin: 6px 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 26px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 24px; border-radius: 999px; text-decoration: none; font-weight: 700; transition: transform .18s ease; }
  a.btn:hover { transform: translateY(-3px) scale(1.03); }
  a.btn:active { transform: scale(.94); }
  .primary { background: var(--aqua); color: var(--btn); }
  .ghost { border: 1px solid rgba(0,0,0,.25); color: var(--ink); }
  @media (prefers-color-scheme: dark) { .ghost { border-color: rgba(255,255,255,.25); } }
</style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Waduh, halamannya gak ketemu</h1>
    <p>Link yang kamu buka mungkin salah ketik atau sudah dipindah. Balik ke beranda aja, atau langsung gabung ke servernya.</p>
    <div class="row">
      <a class="btn primary" href="/GameVerse/">Ke Beranda</a>
      <a class="btn ghost" href="https://discord.gg/N8Wg9Zv3z5" target="_blank" rel="noopener">Join Server</a>
    </div>
  </main>
</body>
</html>
